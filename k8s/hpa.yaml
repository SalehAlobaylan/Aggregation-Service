# Role-specific scaling. The external metrics are exported by Aggregation and
# require the deployment's metrics adapter (or KEDA) in the target cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: aggregation-news-hpa}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: aggregation-news}
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior: {scaleDown: {stabilizationWindowSeconds: 300}, scaleUp: {stabilizationWindowSeconds: 30}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: aggregation-pods-control-hpa}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: aggregation-pods-control}
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
  behavior: {scaleDown: {stabilizationWindowSeconds: 300}, scaleUp: {stabilizationWindowSeconds: 30}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: aggregation-media-executor-hpa}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: aggregation-media-executor}
  minReplicas: 1
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
    - type: External
      external:
        metric: {name: aggregation_media_eligible_work_age_seconds}
        target: {type: Value, value: "300"}
    - type: External
      external:
        metric: {name: aggregation_media_permit_saturation}
        target: {type: Value, value: "0.8"}
    - type: External
      external:
        metric: {name: aggregation_queue_depth, selector: {matchLabels: {queue: pods-media-queue}}}
        target: {type: AverageValue, averageValue: "5"}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 600}
    scaleUp: {stabilizationWindowSeconds: 30}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: aggregation-media-maintenance-hpa}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: aggregation-media-maintenance}
  minReplicas: 0
  maxReplicas: 4
  metrics:
    - type: External
      external:
        metric: {name: aggregation_maintenance_queue_depth}
        target: {type: AverageValue, averageValue: "10"}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 600}
    scaleUp: {stabilizationWindowSeconds: 60}
