# Explicit role deployments. Do not replace these with the legacy `all`
# command: queue ownership and resource domains are intentionally isolated.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregation-intake-control
  labels: {app: aggregation, role: intake-control}
spec:
  replicas: 1
  selector: {matchLabels: {app: aggregation, role: intake-control}}
  template:
    metadata:
      labels: {app: aggregation, role: intake-control}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "5002", prometheus.io/path: /metrics}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: intake-control
          image: ghcr.io/your-org/aggregation-service:latest
          command: ["node", "dist/index.js", "intake-control"]
          ports: [{name: metrics, containerPort: 5002}]
          envFrom: [{configMapRef: {name: aggregation-config}}, {secretRef: {name: aggregation-secrets}}]
          env: [{name: ROLE, value: intake-control}, {name: METRICS_PORT, value: "5002"}]
          resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {cpu: 500m, memory: 1Gi, ephemeral-storage: 2Gi}}
          readinessProbe: {httpGet: {path: /ready, port: metrics}, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: metrics}, initialDelaySeconds: 20, periodSeconds: 30, timeoutSeconds: 5}
          volumeMounts: [{name: scratch, mountPath: /tmp/wahb-media}]
      volumes: [{name: scratch, emptyDir: {sizeLimit: 2Gi}}]
---
