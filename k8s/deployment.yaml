apiVersion: v1
kind: Service
metadata:
  name: aggregation-service
  labels: {app: aggregation, role: intake-control}
spec:
  type: ClusterIP
  selector: {app: aggregation, role: intake-control}
  ports: [{name: metrics, port: 5002, targetPort: metrics}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aggregation-config
data:
  CMS_BASE_URL: "http://cms-service.default.svc.cluster.local/internal"
  REDIS_URL: "redis://redis-master.default.svc.cluster.local:6379"
  STORAGE_ENDPOINT: "https://your-storage.example"
  STORAGE_BUCKET: "wahb-media"
  ADMIN_JWT_ISSUER: "cms-service"
  ADMIN_JWT_AUDIENCE: "platform-console"
  ADMIN_ALLOWED_ROLES: "admin,manager"
  PLATFORM_CONSOLE_ORIGINS: "https://wahb-console.salehspace.dev"
  MEDIA_TEMP_DIR: "/tmp/wahb-media"
  RESOURCE_DOMAIN: "aggregation"
