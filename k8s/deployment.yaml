apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregation-media-executor
  labels: {app: aggregation, role: media-executor}
spec:
  replicas: 1
  selector: {matchLabels: {app: aggregation, role: media-executor}}
  template:
    metadata:
      labels: {app: aggregation, role: media-executor}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "5002", prometheus.io/path: /metrics}
    spec:
      terminationGracePeriodSeconds: 120
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: media-executor
          image: ghcr.io/your-org/aggregation-service:latest
          command: ["node", "dist/index.js", "media-executor"]
          ports: [{name: metrics, containerPort: 5002}]
          envFrom: [{configMapRef: {name: aggregation-config}}, {secretRef: {name: aggregation-secrets}}]
          env:
            - {name: ROLE, value: media-executor}
            - {name: METRICS_PORT, value: "5002"}
            - {name: MEDIA_JOB_TIMEOUT_MS, value: "3600000"}
            - {name: WORKER_CONCURRENCY, value: "2"}
            - {name: YOUTUBE_PO_TOKEN_PROVIDER_URL, value: "http://127.0.0.1:4416"}
          resources:
            requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 8Gi}
            limits: {cpu: "4", memory: 8Gi, ephemeral-storage: 24Gi}
          readinessProbe: {httpGet: {path: /ready, port: metrics}, initialDelaySeconds: 20, periodSeconds: 15, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: metrics}, initialDelaySeconds: 30, periodSeconds: 30, timeoutSeconds: 5}
          volumeMounts: [{name: media-scratch, mountPath: /tmp/wahb-media}]
        - name: youtube-pot-provider
          image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
          ports: [{name: youtube-pot, containerPort: 4416}]
          startupProbe: {httpGet: {path: /ping, port: youtube-pot}, periodSeconds: 2, failureThreshold: 15}
          readinessProbe: {httpGet: {path: /ping, port: youtube-pot}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /ping, port: youtube-pot}, initialDelaySeconds: 15, periodSeconds: 30, timeoutSeconds: 3}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes: [{name: media-scratch, emptyDir: {sizeLimit: 24Gi}}]
---
