services:
  # Explicit role topology. This file never starts the mixed `all` process.
  aggregation-intake-control: &aggregation-common
    build: .
    command: ["node", "dist/index.js", "intake-control"]
    container_name: aggregation-intake-control
    environment: &aggregation-environment
      CMS_BASE_URL: http://host.docker.internal:8080/internal
      CMS_SERVICE_TOKEN: dev-service-token
      JWT_SECRET: dev-jwt-secret
      ADMIN_JWT_ISSUER: cms-service
      ADMIN_JWT_AUDIENCE: platform-console
      ADMIN_ALLOWED_ROLES: admin,manager
      PLATFORM_CONSOLE_ORIGINS: http://localhost:3005,http://localhost:3000
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: wahb-media
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_PUBLIC_URL: http://localhost:9000
      ENRICHMENT_BASE_URL: http://host.docker.internal:5050
      ENRICHMENT_SERVICE_TOKEN: dev-service-token
      MEDIA_TEMP_DIR: /tmp/wahb-media
      LOG_LEVEL: info
      METRICS_PORT: "5002"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "5002:5002"
    volumes:
      - ./config:/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    tmpfs:
      - /tmp/wahb-media:rw,size=2g

  aggregation-news:
    <<: *aggregation-common
    command: ["node", "dist/index.js", "news"]
    container_name: aggregation-news
    environment: *aggregation-environment
    ports: []
    volumes:
      - ./config:/config:ro
    tmpfs:
      - /tmp/wahb-media:rw,size=3g

  aggregation-pods-control:
    <<: *aggregation-common
    command: ["node", "dist/index.js", "pods-control"]
    container_name: aggregation-pods-control
    environment: *aggregation-environment
    ports: []
    volumes:
      - ./config:/config:ro
    tmpfs:
      - /tmp/wahb-media:rw,size=3g

  aggregation-legacy-drain:
    <<: *aggregation-common
    command: ["node", "dist/index.js", "legacy-drain"]
    container_name: aggregation-legacy-drain
    environment: *aggregation-environment
    ports: []
    volumes:
      - ./config:/config:ro
    tmpfs:
      - /tmp/wahb-media:rw,size=3g

  aggregation-media-executor:
    <<: *aggregation-common
    command: ["node", "dist/index.js", "media-executor"]
    container_name: aggregation-media-executor
    environment:
      <<: *aggregation-environment
      WORKER_CONCURRENCY: "2"
      MEDIA_JOB_TIMEOUT_MS: "3600000"
      YOUTUBE_PO_TOKEN_PROVIDER_URL: http://youtube-pot-provider:4416
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      youtube-pot-provider:
        condition: service_healthy
    ports: []
    volumes:
      - ./config:/config:ro
    tmpfs:
      - /tmp/wahb-media:rw,size=24g
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G

  youtube-pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    container_name: aggregation-youtube-pot-provider
    restart: unless-stopped
    # Loopback publication lets the supported host-based start.sh topology use
    # the same provider without exposing it to the LAN.
    ports:
      - "127.0.0.1:4416:4416"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  aggregation-media-maintenance:
    <<: *aggregation-common
    command: ["node", "dist/index.js", "media-maintenance"]
    container_name: aggregation-media-maintenance
    environment: *aggregation-environment
    ports: []
    volumes:
      - ./config:/config:ro
    tmpfs:
      - /tmp/wahb-media:rw,size=8g
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: aggregation-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: aggregation-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc
    container_name: aggregation-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/wahb-media --ignore-existing;
      mc anonymous set public local/wahb-media;"

volumes:
  redis-data:
  minio-data:
